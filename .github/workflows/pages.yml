name: Deploy Decent Voyager to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify checked-in shell bundle
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run build:shell
          git diff --exit-code -- src/bundle.js
          git diff --exit-code -- src/build
          test -z "$(git ls-files --others --exclude-standard src/build)"
      - name: Verify matching live referee ruleset before publishing
        run: |
          node <<'NODE'
          const expected = require('./src/js/ruleset');
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            for (let attempt = 0; attempt < 60; attempt++) {
              try {
                const response = await fetch('https://decent-voyager-referee.onrender.com/health', { signal: AbortSignal.timeout(10000) });
                if (!response.ok) throw new Error(`Referee HTTP ${response.status}`);
                const health = await response.json();
                if (health.status === 'ok' && health.ruleset === expected && health.replayApi && health.captureApi && health.transitionActions && health.rewardRotation && health.signerConfigured) {
                  console.log(`Verified live referee ${expected}`);
                  return;
                }
                console.log(`Waiting for ${expected}; live ruleset is ${health.ruleset}`);
              } catch (error) {
                console.error(`Referee readiness check: ${error.message}`);
              }
              await delay(10000);
            }
            throw new Error('Matching referee is not ready; refusing frontend publication.');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
