name: Prepare Supporter DNFT
# DecentHead product kit: keep uses and head_ref pinned to the same commit.
# Existing frozen releases must never be prepared again.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to prepare
        required: true
permissions:
  contents: write
  issues: write
concurrency:
  group: supporter-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    uses: TheJollyLaMa/DecentHead/.github/workflows/product-supporter-prepare.yml@8523309e99126f5df84400317e6401c583525124
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      head_ref: 8523309e99126f5df84400317e6401c583525124
      product_name: Decent Voyager
      tagline: "Galactic Gauntlet: a 20-level space adventure"
      site_root: src
      ens_name: ${{ vars.SUPPORTER_ENS_NAME }}
    secrets:
      PINATA_JWT: ${{ secrets.PINATA_JWT }}
